name: Build

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build

      - name: Configure
        run: meson setup build --buildtype=release

      - name: Compile
        run: meson compile -C build

      - name: Smoke test
        run: ./build/yt-dlpd --version

      - name: Package
        run: |
          name=yt-dlpd-linux-${{ matrix.arch }}
          mkdir "$name"
          cp build/yt-dlpd ytdlpd.service README.md LICENSE "$name"/
          tar -czf "$name.tar.gz" "$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlpd-linux-${{ matrix.arch }}
          path: yt-dlpd-linux-${{ matrix.arch }}.tar.gz

  release:
    name: Upload release assets
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yt-dlpd-linux-*
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" yt-dlpd-linux-*.tar.gz --clobber --repo "${{ github.repository }}"
